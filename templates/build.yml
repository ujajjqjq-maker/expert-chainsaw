name: Build jar

on:
  push:
    paths-ignore: ['dist/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

# إلغاء أي بناء قديم لنفس الفرع عند وصول دفعة جديدة
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || 'gradle' }}

      - name: Build (Maven or Gradle)
        run: |
          if [ -f pom.xml ]; then
            mvn -B -ntp -q -T 1C -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true package
            OUT=target
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            chmod +x gradlew 2>/dev/null || true
            (./gradlew --no-daemon --parallel --build-cache -x test build 2>/dev/null || gradle --no-daemon --parallel -x test build)
            OUT=build/libs
          else
            echo "No pom.xml or build.gradle found"; exit 1
          fi
          mkdir -p dist
          find "$OUT" -maxdepth 1 -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          ls -l dist

      - name: Commit jar to dist/
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dist/*.jar
          git commit -m "Built jar [skip ci]" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push
