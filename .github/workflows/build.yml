name: Build StarkAC

on:
  push:
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :bukkit:shadowJar --no-daemon --stacktrace -x test
      - name: Commit jar to dist/
        run: |
          mkdir -p dist
          cp bukkit/build/libs/StarkAC.jar dist/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dist/StarkAC.jar
          git commit -m "Built jar [skip ci]" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push
